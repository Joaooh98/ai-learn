# LiteLLM Proxy configuration.
#
# The application only knows the internal gateway name "developer-assistant".
# The real provider/model stays behind the proxy.
model_list:
  - model_name: developer-assistant
    litellm_params:
      model: openai/gpt-4.1-mini
      api_key: os.environ/OPENAI_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
